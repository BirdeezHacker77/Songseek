name: Release

# Manual-only until Docker Hub credentials exist for this fork. Publishing needs repo
# secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; GHCR uses the built-in GITHUB_TOKEN.
# Add those, then restore the tag trigger below to cut a release by pushing a v* tag.
#
# on:
#   push:
#     tags:
#       - "v*"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v1.2.3"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        env:
          # workflow_dispatch supplies the tag directly; a restored tag trigger
          # leaves it empty and GITHUB_REF carries refs/tags/<tag> instead.
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_REF#refs/tags/}}" >> "$GITHUB_OUTPUT"

      - name: Get build date
        id: date
        run: echo "timestamp=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"

      - name: Warm cache (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            COMMIT_TAG=${{ steps.version.outputs.tag }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          # workflow_dispatch supplies the tag directly; a restored tag trigger
          # leaves it empty and GITHUB_REF carries refs/tags/<tag> instead.
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_REF#refs/tags/}}" >> "$GITHUB_OUTPUT"

      - name: Get build date
        id: date
        run: echo "timestamp=$(git log -1 --pretty=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "TAGS<<EOF"
            if [[ "$TAG" == *-* ]]; then
              # pre-release (beta): quiet, obscure name only, Docker Hub
              echo "songseek/dn-beta:$TAG"
              echo "songseek/dn-beta:beta"
            else
              # stable: org namespace on ghcr + Docker Hub
              echo "ghcr.io/birdeezhacker77/songseek:$TAG"
              echo "birdeezhacker77/songseek:$TAG"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: |
            COMMIT_TAG=${{ steps.version.outputs.tag }}
            BUILD_DATE=${{ steps.date.outputs.timestamp }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
          provenance: false

      - name: Tag latest (stable releases only)
        if: ${{ !contains(steps.version.outputs.tag, '-') }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/birdeezhacker77/songseek:latest" \
            -t "birdeezhacker77/songseek:latest" \
            "birdeezhacker77/songseek:${TAG}"

